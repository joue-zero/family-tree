<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>شجرة العيلة</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e6f5d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="شجرة العيلة">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <h1 id="title">شجرة العيلة</h1>
  <div id="searchwrap">
    <input id="search" type="search" placeholder="ابحث عن اسم…" autocomplete="off">
    <ul id="results" hidden></ul>
  </div>
  <div class="actions">
    <button id="btnMe" title="حدد نفسك عشان تشوف صلة كل واحد بيك"><span class="ic">👤</span><span class="tx">أنا مين؟</span></button>
    <button id="btnUp" title="الجيل الأعلى"><span class="ic">⇡</span><span class="tx">فوق</span></button>
    <button id="btnBday" title="أعياد الميلاد والذكرى القادمة">🎂</button>
    <button id="btnGaps" hidden title="ناقص إيه؟ (أسئلة، تكرار، بيانات ناقصة)"><span class="ic">📋</span><span class="tx">ناقص إيه</span></button>
    <button id="btnCmp" title="صلة القرابة بين أشخاص"><span class="ic">⚖</span><span class="tx">صلة القرابة</span></button>
    <button id="btnEdit" title="وضع التعديل"><span class="ic">✎</span><span class="tx">تعديل</span></button>
    <button id="btnSave" class="primary" hidden>حفظ <b id="dirtyMark">●</b></button>
    <button id="btnEnc" hidden title="شفّر الشجرة بكلمة سر"><span class="ic">🔒</span><span class="tx">فعّل التشفير</span></button>
    <button id="btnInstall" hidden><span class="ic">📲</span><span class="tx">ثبّت</span></button>
    <button id="btnSettings" title="الإعدادات">⚙</button>
  </div>
</header>

<main id="view">
  <div id="stage"><svg id="lines"></svg><div id="cards"></div></div>
  <div id="zoom">
    <button id="zIn" title="تكبير">+</button>
    <button id="zOut" title="تصغير">−</button>
    <button id="zFit" title="ملاءمة الشاشة">⤢</button>
    <button id="zPrint" title="تصدير / طباعة">🖨</button>
  </div>
  <canvas id="mini" width="170" height="116" hidden></canvas>
  <div id="empty" hidden>
    <p>مفيش أي أشخاص لسه.</p>
    <button id="btnFirst" class="primary">+ ابدأ بأول شخص</button>
  </div>
</main>

<div id="lock" hidden><div class="lockbox"><div class="lk">🔒</div><h2>شجرة العيلة</h2><p>اكتب كلمة سر العيلة</p>
  <input id="lockPw" type="password" autocomplete="current-password" placeholder="كلمة السر">
  <label class="chk"><input type="checkbox" id="lockRemember" checked> افتكرني على الجهاز ده</label>
  <button id="lockGo" class="primary">فتح</button><div id="lockErr"></div></div></div>
<aside id="panel" hidden></aside>
<section id="cmp" hidden></section>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
